<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>ワクチン早見表 - 松口内科・循環器内科クリニック</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;background:#f5f5f0;color:#1a1a1a;font-size:16px}
.container{max-width:900px;margin:0 auto;padding:16px}
.hdr{background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:14px;border:.5px solid #e0dfd8;display:flex;align-items:center;gap:12px}
.hdr-icon{width:40px;height:40px;background:#E6F1FB;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.hdr h1{font-size:17px;font-weight:600;color:#1a1a1a}
.hdr p{font-size:12px;color:#888;margin-top:2px}
.controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search-wrap{position:relative;flex:1;min-width:160px}
.search-wrap input{width:100%;padding:9px 12px 9px 34px;font-size:14px;border:.5px solid #ccc;border-radius:22px;background:#fff;color:#1a1a1a;outline:none}
.search-wrap input:focus{border-color:#378ADD}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;color:#999}
.fb{font-size:13px;padding:7px 15px;border-radius:22px;border:.5px solid #ccc;background:#fff;color:#666;cursor:pointer;font-family:inherit}
.fb.on{background:#E6F1FB;border-color:#378ADD;color:#0C447C;font-weight:600}
.cnt{font-size:12px;color:#888;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.card{background:#fff;border:.5px solid #e0dfd8;border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#aaa}
.card.open{border-color:#378ADD;border-width:1.5px}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.vname{font-size:15px;font-weight:600;color:#1a1a1a;line-height:1.3}
.vsub{font-size:11px;color:#888;margin-top:2px}
.badges{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:500}
.b-appt{background:#FAEEDA;color:#633806}
.b-free{background:#E6F1FB;color:#0C447C}
.b-sub{background:#E1F5EE;color:#085041}
.price-col{text-align:right;flex-shrink:0}
.price{font-size:18px;font-weight:700;color:#185FA5}
.pnote{font-size:11px;color:#888;margin-top:1px}
.div{border:none;border-top:.5px solid #e8e8e4;margin:10px 0}
.sbox{background:#f8f8f5;border-radius:8px;padding:10px 12px}
.slabel{font-size:11px;font-weight:700;color:#0F6E56;margin-bottom:5px;display:flex;align-items:center;gap:4px;letter-spacing:.3px}
.srow{font-size:12px;color:#1a1a1a;line-height:1.85}
.srow em{color:#888;font-style:normal}
.snone{font-size:12px;color:#888}
.dmore{display:none;margin-top:8px}
.card.open .dmore{display:block}
.dtgl{font-size:12px;color:#378ADD;margin-top:8px;display:flex;align-items:center;gap:3px}
.memo{font-size:12px;color:#666;line-height:1.7}
/* 帯状疱疹 */
.age-grid{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}
.age-pill{font-size:12px;padding:3px 10px;border-radius:12px;font-weight:600;background:#FBEAF0;color:#4B1528;border:.5px solid #ED93B1}
.age-note{font-size:11px;color:#a05010;margin-top:3px;line-height:1.6;background:#FAEEDA;border-radius:6px;padding:4px 8px}
.hz-period-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.hz-period-table th{background:#f0ede8;padding:5px 8px;text-align:left;font-weight:600;color:#555;border:.5px solid #ddd}
.hz-period-table td{padding:6px 8px;border:.5px solid #e8e5e0;vertical-align:top;line-height:1.6}
.hz-period-table tr.birthday td{background:#FBEAF0}
.hz-period-table tr.nendo td{background:#E1F5EE}
.period-badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:8px;font-weight:600;margin-right:4px}
.pb-birthday{background:#F4C0D1;color:#4B1528}
.pb-nendo{background:#9FE1CB;color:#04342C}
.hz-compare{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.hz-col{border-radius:8px;padding:9px 11px}
.hz-col.shin{background:#E1F5EE;border:.5px solid #5DCAA5}
.hz-col.biken{background:#E6F1FB;border:.5px solid #85B7EB}
.hz-col-name{font-size:11px;font-weight:700;margin-bottom:5px}
.hz-col.shin .hz-col-name{color:#085041}
.hz-col.biken .hz-col-name{color:#0C447C}
.hz-row{font-size:11px;line-height:1.8;color:#1a1a1a}
.hz-row em{color:#888;font-style:normal}
.hz-price-after{font-size:14px;font-weight:700}
.hz-col.shin .hz-price-after{color:#0F6E56}
.hz-col.biken .hz-price-after{color:#185FA5}
.hz-price-before{font-size:11px;color:#aaa;text-decoration:line-through}
.subsidy-cost-big{font-size:14px;font-weight:700;color:#0F6E56}
.empty{text-align:center;padding:2rem;color:#888;font-size:14px}
</style>
</head>

let flt='all';
function setF(f,btn){
  flt=f;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function subsidyBlock(v){

  if(!s.yes) return `<div class="snone">— ${s.note}</div>`;
  if(v.isHerpes||v.isHerpesBiken){
    return `<div class="slabel">🏦 福岡市任意接種助成あり　<span style="font-size:11px;font-weight:400;color:#0F6E56">令和6年4月1日〜</span></div>
      <div class="srow" style="margin-bottom:8px"><em>費用：</em><span class="subsidy-cost-big">${s.cost}</span>　<span class="hz-price-before">${s.costBefore}</span></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="background:#FBEAF0;border:.5px solid #ED93B1;border-radius:8px;padding:8px 10px">
          <div style="display:flex;flex-wrap:wrap;gap:3px;margin-bottom:5px">

            <span class="age-pill" style="display:inline-block">55歳</span>
            <span class="age-pill" style="display:inline-block">60歳</span>
          </div>
          <div style="font-size:12px;color:#1a1a1a;line-height:1.7">

          </div>
        </div>
        <div style="background:#EAF3DE;border:.5px solid #639922;border-radius:8px;padding:8px 10px">
          <div style="display:flex;flex-wrap:wrap;gap:3px;margin-bottom:5px">
            <span class="age-pill" style="display:inline-block;background:#C0DD97;color:#173404;border-color:#639922">65歳</span>
            <span class="age-pill" style="display:inline-block;background:#C0DD97;color:#173404;border-color:#639922">70歳</span>
            <span class="age-pill" style="display:inline-block;background:#C0DD97;color:#173404;border-color:#639922">75歳</span>
            <span class="age-pill" style="display:inline-block;background:#C0DD97;color:#173404;border-color:#639922">80歳</span>
            <span class="age-pill" style="display:inline-block;background:#C0DD97;color:#173404;border-color:#639922">85歳</span>
            <span class="age-pill" style="display:inline-block;background:#C0DD97;color:#173404;border-color:#639922">90歳</span>
            <span class="age-pill" style="display:inline-block;background:#C0DD97;color:#173404;border-color:#639922">95歳</span>
            <span class="age-pill" style="display:inline-block;background:#C0DD97;color:#173404;border-color:#639922">100歳</span>
          </div>
          <div style="font-size:12px;color:#1a1a1a;line-height:1.7">
            <span class="period-badge pb-nendo">年度内</span>

function herpesCompare(){

function render(){
  const q=document.getElementById('srch').value.toLowerCase();
  let list=V.filter(v=>(v.name+v.sub+(v.tags||'')).toLowerCase().includes(q));
  if(flt==='sub') list=list.filter(v=>v.subsidy.yes);
  if(flt==='appt') list=list.filter(v=>v.appt);
  document.getElementById('cnt').textContent=list.length+' 件';
  if(!list.length){
    document.getElementById('grid').innerHTML='<div class="empty">該当なし</div>';
    return;
  }
  document.getElementById('grid').innerHTML=list.map(v=>`
    <div class="card" id="c${v.id}" onclick="tog(${v.id})">
      <div class="card-top">
        <div>
          <div class="vname">${v.name}</div>
          ${v.sub?`<div class="vsub">${v.sub}</div>`:''}
          <div class="badges">
            ${v.appt
              ?'<span class="badge b-appt">📅 要予約</span>'
              :'<span class="badge b-free">🚶 予約不要</span>'}
            ${v.subsidy.yes?'<span class="badge b-sub">🏦 助成あり</span>':''}
          </div>
        </div>
        <div class="price-col">
          <div class="price">¥${v.price.toLocaleString()}</div>
          <div class="pnote">${v.pnote}</div>
        </div>
      </div>
      <hr class="div">
      <div class="sbox">${subsidyBlock(v)}</div>
      <div class="dmore">
        <hr class="div">
        <div class="memo">ℹ️ ${v.memo}</div>
        ${(v.isHerpes||v.isHerpesBiken)?herpesCompare():''}
        ${v.isHPV?`<div style="margin-top:8px;padding:10px 12px;background:#F0EAF8;border-radius:8px;font-size:12px;color:#4B1A7B;line-height:1.8">
          <div style="font-weight:700;margin-bottom:8px;font-size:13px">📋 接種スケジュール（シルガード9）</div>
          <div style="background:#E8F5E3;border-radius:8px;padding:8px 10px;margin-bottom:6px;border-left:4px solid #4CAF50">
            <div style="font-weight:700;color:#2E7D32;margin-bottom:4px">🟢 合計2回｜1回目を15歳になるまでに受ける場合</div>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span style="background:#388E3C;color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0">1回目</span>
              <span style="color:#555;font-size:13px">━━━━ 5か月以上あける ━━━━</span>
              <span style="background:#388E3C;color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0">2回目</span>
              <span style="font-weight:700;color:#2E7D32">✅ 完了</span>
            </div>
            <div style="font-size:11px;color:#555;margin-top:4px">※ 5か月未満になった場合は3回接種が必要</div>
          </div>
          <div style="background:#FFF8E1;border-radius:8px;padding:8px 10px;border-left:4px solid #FFA000">
            <div style="font-weight:700;color:#E65100;margin-bottom:4px">🟡 合計3回｜1回目を15歳になってから受ける場合</div>
            <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">
              <span style="background:#388E3C;color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0">1回目</span>
              <span style="color:#555;font-size:11px">─2か月後─</span>
              <span style="background:#388E3C;color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0">2回目</span>
              <span style="color:#555;font-size:11px">─4か月後─</span>
              <span style="background:#388E3C;color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0">3回目</span>
              <span style="font-weight:700;color:#E65100">✅ 完了</span>
            </div>
            <div style="font-size:11px;color:#555;margin-top:4px">※ 所定タイミングが難しい場合：2回目は1回目から1か月以上、3回目は2回目から3か月以上あける</div>
          </div>
          <div style="margin-top:6px;font-size:11px;background:#E3F2FD;border-radius:6px;padding:5px 8px;color:#1565C0">
            ⏱ いずれの場合も<strong>1年以内</strong>に規定回数の接種を終えることが望ましい
          </div>
        </div>`:''}
      </div>
      <div class="dtgl">▼ 詳細・メモを見る</div>
    </div>
  `).join('');
}
function tog(id){document.getElementById('c'+id).classList.toggle('open')}
render();
</script>
</body>
</html>
